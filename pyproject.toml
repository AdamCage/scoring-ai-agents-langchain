[project]
name = "creditlens"
version = "1.0.0"
description = "Agentic credit scoring and explainability lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "orjson>=3.10.0",
  "sse-starlette>=2.1.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langsmith>=0.1.0",
  "langfuse>=2.0.0,<3",
  "catboost>=1.2.7",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "rank-bm25>=0.2.2",
  "qdrant-client>=1.12.0",
  "pyyaml>=6.0.2",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "backend/src"]
include = ["contracts*", "creditlens*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "contracts", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "backend/src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
pretty = true
packages = ["contracts", "creditlens"]
mypy_path = "backend/src"
