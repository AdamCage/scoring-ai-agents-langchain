services:
  app:
    build: .
    image: creditlens:local
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/creditlens.db
      QDRANT_URL: http://qdrant:6333
    volumes:
      - app_data:/data
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:8000:8000"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  app_data:
  qdrant_data:
