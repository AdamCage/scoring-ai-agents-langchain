services:
  app:
    build: .
    image: creditlens:local
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/creditlens.db
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://127.0.0.1:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-lf_pk_creditlens_demo}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-lf_sk_creditlens_demo}
      OBSERVABILITY: both
    volumes:
      - app_data:/data
    depends_on:
      - langfuse
    ports:
      - "127.0.0.1:8000:8000"

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://127.0.0.1:3000}
      NEXTAUTH_SECRET: creditlens-langfuse-nextauth
      SALT: creditlens-langfuse-salt
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: creditlens
      LANGFUSE_INIT_ORG_NAME: CreditLens
      LANGFUSE_INIT_PROJECT_ID: creditlens
      LANGFUSE_INIT_PROJECT_NAME: creditlens
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: lf_pk_creditlens_demo
      LANGFUSE_INIT_PROJECT_SECRET_KEY: lf_sk_creditlens_demo
      LANGFUSE_INIT_USER_EMAIL: demo@creditlens.local
      LANGFUSE_INIT_USER_NAME: CreditLens
      LANGFUSE_INIT_USER_PASSWORD: creditlens-demo
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  app_data:
  langfuse_db:
