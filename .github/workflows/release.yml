name: release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/train_model.py
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm install && npm run lint && npm run build

  eval:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/train_model.py
      - run: python -m creditlens.evaluation.run_evals --experiment hybrid-rerank --smoke
        env:
          PYTHONPATH: ".:backend/src"
      - run: python -m creditlens.evaluation.quality_gate --experiment hybrid-rerank
        env:
          PYTHONPATH: ".:backend/src"

  gate:
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - run: echo "test and hybrid-rerank quality gate passed; production is systemd/rsync, not GHCR compose"
