name: release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/train_model.py
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm install && npm run lint && npm run build

  eval:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/train_model.py
      - run: python -m creditlens.evaluation.run_evals --experiment hybrid-rerank --smoke
        env:
          PYTHONPATH: ".:backend/src"
      - run: python -m creditlens.evaluation.quality_gate --experiment hybrid-rerank
        env:
          PYTHONPATH: ".:backend/src"

  deploy:
    needs: eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
      - name: Push
        if: ${{ secrets.VM_HOST != '' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: SSH compose pull
        if: ${{ secrets.VM_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/creditlens
            export CREDITLENS_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
            docker compose -f deploy/compose/docker-compose.yml pull
            docker compose -f deploy/compose/docker-compose.yml up -d
            curl -fsS http://127.0.0.1:8000/api/health
