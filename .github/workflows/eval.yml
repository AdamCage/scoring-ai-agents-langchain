name: eval

on:
  workflow_dispatch:

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/train_model.py
      - run: python -m creditlens.evaluation.run_evals --experiment hybrid-rerank --smoke
        env:
          PYTHONPATH: ".:backend/src"
      - run: python -m creditlens.evaluation.quality_gate --experiment hybrid-rerank
        env:
          PYTHONPATH: ".:backend/src"
