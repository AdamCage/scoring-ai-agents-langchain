# Production vhost for credit-adamcage.ru.
# SNI only — do not mark default_server (Love AI keeps the bare IP).
server {
    listen 80;
    listen [::]:80;
    server_name credit-adamcage.ru www.credit-adamcage.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://credit-adamcage.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name credit-adamcage.ru www.credit-adamcage.ru;

    ssl_certificate /etc/letsencrypt/live/credit-adamcage.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/credit-adamcage.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no always;
    }
}
